{% extends "base.html" %}
{% block title %}{{ product.name }} - {{ site_name }}{% endblock %}
{% block content %}
<p><a href="{{ url_for('index') }}">&larr; Torna al catalogo</a></p>
<h1>{{ product.name }}</h1>

<div class="product-gallery">
    {% for image in product.images %}
    <img src="{{ url_for('static', filename='uploads/' ~ image.filename) }}" alt="{{ product.name }} - foto {{ loop.index }}">
    {% endfor %}
</div>
{% endblock %}
